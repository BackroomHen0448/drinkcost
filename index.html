<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DrinkCostPro">
<meta name="theme-color" content="#0b0c10">
<link rel="manifest" href="manifest.json">

<title>DrinkCostPro — Bar Cost & Pour Cost</title>
<style>
:root {
  --bg: #0b0c10;
  --surface: #13151d;
  --card: #171a24;
  --card-hover: #1d212e;
  --card-border: #262a38;
  --text: #f3f4f6;
  --subtext: #8e95ab;
  --accent: #d4a853;
  --accent-light: #e6be6a;
  --accent-soft: rgba(212, 168, 83, 0.14);
  --green: #38c172;
  --green-soft: rgba(56, 193, 114, 0.14);
  --amber: #e09f3e;
  --amber-soft: rgba(224, 159, 62, 0.15);
  --red: #e05252;
  --red-soft: rgba(224, 82, 82, 0.15);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  margin: 0; padding: 0;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
  background-color: var(--bg);
  color: var(--text);
  padding-top: env(safe-area-inset-top);
  padding-bottom: calc(88px + env(safe-area-inset-bottom));
  user-select: none;
  -webkit-font-smoothing: antialiased;
}
header {
  position: sticky; top: 0; z-index: 20;
  background: rgba(11, 12, 16, 0.88);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--card-border);
  padding: 13px 16px;
}
.header-top {
  display: flex; justify-content: space-between; align-items: center;
  max-width: 1100px; margin: 0 auto;
}
.app-title {
  font-size: 19px; font-weight: 700; letter-spacing: -0.3px;
  display: flex; align-items: center; gap: 9px; color: var(--text);
}
.app-title-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--accent); box-shadow: 0 0 10px var(--accent);
}
.save-badge {
  font-size: 11px; font-weight: 600; color: var(--green);
  background: var(--green-soft); border: 1px solid rgba(56, 193, 114, 0.25);
  padding: 4px 11px; border-radius: 999px;
}
.container { max-width: 1100px; margin: 0 auto; padding: 14px 16px; }

/* KPI Strip */
.kpi-strip {
  display: grid; grid-template-columns: repeat(4, minmax(150px, 1fr));
  gap: 10px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 14px;
}
@media (max-width: 680px) {
  .kpi-strip { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; }
  .kpi-card { min-width: 168px; scroll-snap-align: start; }
}
.kpi-card {
  background: linear-gradient(180deg, var(--card) 0%, var(--surface) 100%);
  border: 1px solid var(--card-border);
  border-radius: 14px; padding: 12px 14px;
}
.kpi-title { font-size: 10px; color: var(--subtext); font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px; }
.kpi-val { font-size: 19px; font-weight: 800; margin: 4px 0 2px; color: var(--text); }
.kpi-sub { font-size: 11px; font-weight: 500; color: var(--subtext); }

/* Search & Action Row */
.search-row { display: flex; gap: 8px; margin-bottom: 12px; }
.search-input {
  flex: 1; background: var(--surface); border: 1px solid var(--card-border);
  color: var(--text); border-radius: 12px; padding: 11px 14px;
  font-size: 15px; outline: none; transition: border-color 0.15s;
}
.search-input::placeholder { color: var(--subtext); }
.search-input:focus { border-color: var(--accent); }
.btn-add {
  background: var(--accent); color: #0b0c10; border: none;
  border-radius: 12px; padding: 0 16px; font-weight: 700; font-size: 13px;
  cursor: pointer; white-space: nowrap; transition: opacity 0.15s;
}
.btn-add:active { opacity: 0.85; }
.btn-secondary {
  background: var(--surface); color: var(--accent); border: 1px solid var(--accent);
  border-radius: 10px; padding: 8px 13px; font-weight: 600; font-size: 12px;
  cursor: pointer; white-space: nowrap;
}
.btn-danger {
  background: var(--red-soft); color: var(--red); border: 1px solid rgba(224, 82, 82, 0.35);
  border-radius: 12px; padding: 12px 16px; font-weight: 700; font-size: 13px;
  cursor: pointer; width: 100%; margin-top: 16px; text-align: center;
}

/* Category Pills Bar */
.pills-bar {
  display: flex; gap: 7px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 10px;
  scrollbar-width: none;
}
.pills-bar::-webkit-scrollbar { display: none; }
.pill {
  background: var(--surface); border: 1px solid var(--card-border);
  color: var(--subtext); padding: 7px 14px; border-radius: 999px;
  font-size: 12px; font-weight: 600; white-space: nowrap; cursor: pointer;
  transition: all 0.15s;
}
.pill.active {
  background: var(--accent); color: #0b0c10; border-color: var(--accent); font-weight: 700;
}
.pill-add {
  background: var(--accent-soft); border: 1px dashed var(--accent);
  color: var(--accent); padding: 7px 13px; border-radius: 999px;
  font-size: 12px; font-weight: 700; white-space: nowrap; cursor: pointer;
}

/* Cards List */
.cat-header {
  display: flex; justify-content: space-between; align-items: center;
  font-size: 11px; font-weight: 700; color: var(--accent);
  text-transform: uppercase; letter-spacing: 0.8px;
  margin: 18px 4px 8px;
}
.cat-target-tag {
  font-size: 10px; font-weight: 600; color: var(--subtext);
  background: var(--surface); border: 1px solid var(--card-border);
  padding: 2px 8px; border-radius: 999px; text-transform: none; letter-spacing: 0;
}
.card-list { display: flex; flex-direction: column; gap: 8px; }
.item-card {
  background: var(--card); border: 1px solid var(--card-border);
  border-radius: 14px; padding: 13px 15px;
  display: flex; justify-content: space-between; align-items: center;
  gap: 12px; cursor: pointer; transition: transform 0.1s, border-color 0.15s, background 0.15s;
}
.item-card:active { transform: scale(0.992); border-color: var(--accent); background: var(--card-hover); }
.item-main { flex: 1; min-width: 0; }
.item-name { font-size: 15px; font-weight: 700; margin-bottom: 4px; color: var(--text); }
.item-meta { font-size: 12px; color: var(--subtext); display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.badge-drink {
  background: var(--accent-soft); color: var(--accent-light);
  border: 1px solid rgba(212, 168, 83, 0.28);
  font-weight: 600; font-size: 11px; padding: 2px 9px; border-radius: 999px;
}
.item-right { text-align: right; flex-shrink: 0; }
.price-big { font-size: 17px; font-weight: 800; color: var(--accent-light); }
.cost-big { font-size: 17px; font-weight: 800; color: var(--text); }
.unit-sub { font-size: 11px; color: var(--subtext); margin-top: 2px; }
.pc-badge {
  display: inline-block; font-size: 11px; font-weight: 700;
  padding: 2px 8px; border-radius: 999px; margin-top: 3px;
}
.pc-bar-bg {
  width: 100%; height: 4px; background: rgba(255,255,255,0.06);
  border-radius: 999px; margin: 9px 0 6px; overflow: hidden;
}
.pc-bar-fill { height: 100%; border-radius: 999px; transition: width 0.25s; }

/* Active Filter Banner */
.filter-banner {
  background: var(--accent-soft); border: 1px solid var(--accent);
  border-radius: 14px; padding: 12px 15px; margin-bottom: 12px;
  display: flex; justify-content: space-between; align-items: center; gap: 10px;
}
.btn-reset-filter {
  background: var(--accent); color: #0b0c10; border: none;
  border-radius: 999px; padding: 7px 13px; font-weight: 700; font-size: 12px; cursor: pointer;
}

/* Floating Reactive Notification Banner with Close X */
.reactive-toast {
  position: fixed; bottom: calc(76px + env(safe-area-inset-bottom));
  left: 16px; right: 16px; max-width: 580px; margin: 0 auto;
  background: #1b1e2b;
  border: 1px solid var(--accent);
  color: var(--text); border-radius: 16px; padding: 13px 40px 13px 15px;
  display: flex; justify-content: space-between; align-items: center; gap: 10px;
  box-shadow: 0 14px 34px rgba(0,0,0,0.65); z-index: 40;
}
.reactive-toast-action {
  background: var(--accent); color: #0b0c10; border: none;
  padding: 8px 13px; border-radius: 999px; font-weight: 700; font-size: 12px;
  cursor: pointer; white-space: nowrap;
}
.reactive-toast-close {
  position: absolute; top: 8px; right: 8px;
  width: 24px; height: 24px; border-radius: 50%;
  background: rgba(255,255,255,0.08); color: var(--subtext);
  border: none; font-size: 13px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; line-height: 1;
}
.reactive-toast-close:active { background: rgba(255,255,255,0.2); color: var(--text); }

/* Bottom TabBar */
.tabbar {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: rgba(15, 17, 24, 0.94);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border-top: 1px solid var(--card-border);
  display: flex; justify-content: space-around;
  padding: 8px 0 calc(8px + env(safe-area-inset-bottom));
  z-index: 30;
}
.tab-btn {
  background: none; border: none; color: var(--subtext);
  font-size: 11px; font-weight: 600; display: flex; flex-direction: column;
  align-items: center; gap: 3px; cursor: pointer; flex: 1;
}
.tab-btn span.icon { font-size: 19px; }
.tab-btn.active { color: var(--accent); font-weight: 700; }

/* Modal Sheet */
.modal-backdrop {
  position: fixed; inset: 0; background: rgba(0,0,0,0.72);
  display: none; justify-content: center; align-items: flex-end; z-index: 50;
}
.modal-backdrop.open { display: flex; }
@media (min-width: 700px) {
  .modal-backdrop { align-items: center; }
  .modal-sheet { border-radius: 20px !important; max-width: 560px; }
}
.modal-sheet {
  background: var(--surface); width: 100%; max-height: 90vh;
  border-radius: 22px 22px 0 0; border: 1px solid var(--card-border);
  padding: 18px; overflow-y: auto;
}
.modal-header {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 14px; border-bottom: 1px solid var(--card-border); padding-bottom: 12px;
  gap: 10px;
}
.modal-title { font-size: 17px; font-weight: 800; color: var(--text); }
.btn-close {
  background: var(--accent); color: #0b0c10; border: none;
  border-radius: 999px; padding: 7px 15px; font-weight: 700; font-size: 13px; cursor: pointer;
}
.form-row {
  display: flex; justify-content: space-between; align-items: center;
  padding: 9px 0; border-bottom: 1px solid rgba(255,255,255,0.05); gap: 10px;
}
.form-row label { font-size: 13px; font-weight: 600; color: var(--subtext); flex-shrink: 0; }
.form-input, .form-select {
  background: var(--bg); border: 1px solid var(--card-border);
  color: var(--text); font-size: 15px; font-weight: 700;
  text-align: right; border-radius: 10px; padding: 8px 11px; width: 150px; outline: none;
}
.form-input:focus, .form-select:focus { border-color: var(--accent); }
.form-input-wide, .form-select-wide { width: 210px; text-align: left; }

/* Dynamic Ingredient Builder Row */
.ing-row {
  display: flex; align-items: center; gap: 6px;
  padding: 7px 0; border-bottom: 1px solid rgba(255,255,255,0.05);
}
.ing-row select {
  flex: 1; min-width: 0; background: var(--bg); border: 1px solid var(--card-border);
  color: var(--text); font-size: 13px; font-weight: 600;
  border-radius: 9px; padding: 8px 8px; outline: none;
}
.ing-row input.ing-qty {
  width: 72px; background: var(--bg); border: 1px solid var(--card-border);
  color: var(--accent-light); font-size: 14px; font-weight: 700;
  text-align: right; border-radius: 9px; padding: 8px; outline: none;
}
.ing-unit-lbl { font-size: 11px; color: var(--subtext); width: 22px; text-align: left; }
.ing-remove-btn {
  background: var(--red-soft); color: var(--red); border: none;
  width: 28px; height: 28px; border-radius: 8px; font-weight: 700;
  cursor: pointer; flex-shrink: 0;
}

.settings-card {
  background: var(--card); border: 1px solid var(--card-border);
  border-radius: 14px; padding: 14px; margin-bottom: 10px;
}
.preset-row { display: flex; gap: 7px; flex-wrap: wrap; margin-top: 9px; }
.preset-btn {
  background: var(--surface); color: var(--subtext); border: 1px solid var(--card-border);
  border-radius: 999px; padding: 6px 12px; font-size: 12px; font-weight: 600; cursor: pointer;
}
.preset-btn.active { background: var(--accent); color: #0b0c10; border-color: var(--accent); font-weight: 700; }
.action-btn {
  width: 100%; background: var(--card); border: 1px solid var(--card-border);
  color: var(--text); padding: 13px 15px; border-radius: 12px; font-weight: 600;
  font-size: 14px; cursor: pointer; margin-bottom: 8px; text-align: left;
  display: flex; justify-content: space-between; align-items: center;
}
</style>
</head>
<body>

<header>
  <div class="header-top">
    <div class="app-title">
      <span class="app-title-dot"></span>
      <span>DrinkCostPro</span>
    </div>
    <div class="save-badge" id="saveBadge">✓ Salvato</div>
  </div>
</header>

<div class="container">
  <div class="kpi-strip" id="kpiStrip"></div>

  <!-- TAB 0: BOTTIGLIE -->
  <div id="tabBottles">
    <div class="search-row">
      <input type="search" id="bottleSearch" class="search-input" placeholder="Cerca Campari, Havana 7, Gin, Aperol..." oninput="renderBottles()">
      <button class="btn-add" onclick="openAddBottleModal()">+ Bottiglia</button>
    </div>
    <div class="pills-bar" id="bottleCatPills"></div>
    <div id="bottlesContainer"></div>
  </div>

  <!-- TAB 1: COCKTAIL -->
  <div id="tabCocktails" style="display:none;">
    <div id="activeFilterBanner"></div>
    <div class="search-row">

      <button class="btn-add" onclick="openAddCocktailModal()">+ Cocktail</button>
    </div>
    <div class="pills-bar" id="cocktailCatPills"></div>
    <div id="cocktailsContainer"></div>
  </div>

  <!-- TAB 2: IVA & BACKUP -->
  <div id="tabSettings" style="display:none;">
    <div id="settingsContainer"></div>
  </div>
</div>

<!-- Banner Reattivo Flottante con pulsante X -->
<div id="reactiveToast" class="reactive-toast" style="display:none;"></div>

<!-- Barra Navigazione -->
<nav class="tabbar">
  <button class="tab-btn active" id="navBtn0" onclick="switchTab(0)">
    <span class="icon">🍾</span>
    <span id="navLbl0">Bottiglie</span>
  </button>
  <button class="tab-btn" id="navBtn1" onclick="switchTab(1)">

    <span id="navLbl1">Cocktail</span>
  </button>
  <button class="tab-btn" id="navBtn2" onclick="switchTab(2)">
    <span class="icon">⚙️</span>
    <span>Impostazioni</span>
  </button>
</nav>

<!-- Modale Universale -->
<div class="modal-backdrop" id="modalBackdrop" onclick="if(event.target===this) closeModal()">
  <div class="modal-sheet" id="modalContent"></div>
</div>

let draftIngredients = [];

function ensureDBIntegrity() {
  if (!db.settings) db.settings = getFactoryDB().settings;
  if (!db.settings.categoryTargets) db.settings.categoryTargets = { ...DEFAULT_CATEGORY_TARGETS };
  if (!Array.isArray(db.settings.bottleCategories)) db.settings.bottleCategories = [...DEFAULT_BOTTLE_CATEGORIES];
  if (!Array.isArray(db.settings.cocktailCategories)) db.settings.cocktailCategories = [...DEFAULT_COCKTAIL_CATEGORIES];

  db.bottles.forEach(b => {
    if (b.category && !db.settings.bottleCategories.includes(b.category)) {
      db.settings.bottleCategories.push(b.category);
    }
  });
  db.cocktails.forEach(c => {
    if (c.category && !db.settings.cocktailCategories.includes(c.category)) {
      db.settings.cocktailCategories.push(c.category);
    }
    if (c.category && db.settings.categoryTargets[c.category] === undefined) {
      db.settings.categoryTargets[c.category] = db.settings.targetPourCostPercent || 20.0;
    }
  });
}

function loadDB() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (parsed && parsed.bottles && parsed.cocktails) {
        db = parsed;
      }
    }
  } catch (e) { console.error(e); }
  ensureDBIntegrity();
}

function saveDB() {
  try {
    ensureDBIntegrity();
    localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
    const now = new Date();
    const t = now.toTimeString().split(" ")[0];
    document.getElementById("saveBadge").textContent = "✓ Salvato " + t;
  } catch (e) { console.error(e); }
}

function parseNum(v, fallback) {
  if (typeof v === "number") return v;
  const n = parseFloat(String(v).replace(",", ".").trim());
  return isNaN(n) ? fallback : n;
}

function getBottle(id) {
  return db.bottles.find(b => b.id === id);
}

function getBottleCategories() {
  ensureDBIntegrity();
  return [...db.settings.bottleCategories].sort();
}

function getCocktailCategories() {
  ensureDBIntegrity();
  return [...db.settings.cocktailCategories].sort();
}

function unitCost(b) {
  const net = b.size * Math.max(0.01, 1 - (b.wastePercent / 100));
  return net > 0 ? b.price / net : 0;
}

function cocktailsUsing(bottleId) {
  return db.cocktails.filter(c => c.ingredients.some(i => i.bottleId === bottleId));
}

function effectiveQty(ing) {
  return ing.useWineGlassDose ? db.settings.wineGlassMl : ing.qty;
}

function drinkCost(c) {
  let sum = 0;
  for (const ing of c.ingredients) {
    const b = getBottle(ing.bottleId);
    if (b) sum += effectiveQty(ing) * unitCost(b);
  }
  if (c.includeGarnish) sum += db.settings.garnishCost;
  return sum;
}

function netMenuPrice(c) {
  return c.menuPrice / (1 + db.settings.vatPercent / 100);
}

function pourCostPercent(c) {
  const net = netMenuPrice(c);
  return net > 0 ? (drinkCost(c) / net) * 100 : 0;
}

function netMargin(c) {
  return netMenuPrice(c) - drinkCost(c);
}

function getTargetPourCost(c) {
  if (c.customTargetPC && c.customTargetPC > 0) return c.customTargetPC;
  if (db.settings.categoryTargets && db.settings.categoryTargets[c.category] !== undefined) {
    return db.settings.categoryTargets[c.category];
  }
  return db.settings.targetPourCostPercent || 20.0;
}

function suggestedMenuPrice(c) {
  const target = Math.max(0.01, getTargetPourCost(c) / 100);
  return (drinkCost(c) / target) * (1 + db.settings.vatPercent / 100);
}

function renderKPIs() {
  const count = db.cocktails.length || 1;
  let totDC = 0, totPC = 0, totMargin = 0, overCount = 0;
  for (const c of db.cocktails) {
    const dc = drinkCost(c);
    const pc = pourCostPercent(c);
    const target = getTargetPourCost(c);
    totDC += dc;
    totPC += pc;
    totMargin += netMargin(c);
    if (pc > target) overCount++;
  }
  const avgPC = totPC / count;
  const avgDC = totDC / count;
  const avgM = totMargin / count;

  document.getElementById("kpiStrip").innerHTML = `
    <div class="kpi-card">
      <div class="kpi-title">Pour Cost Medio</div>
      <div class="kpi-val" style="color:${avgPC <= db.settings.targetPourCostPercent ? 'var(--green)' : 'var(--accent-light)'}">${avgPC.toFixed(1)}%</div>
      <div class="kpi-sub">Target per categoria attivo</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-title">Drink Cost Medio</div>
      <div class="kpi-val" style="color:var(--accent-light)">€ ${avgDC.toFixed(2)}</div>
      <div class="kpi-sub">Su ${db.cocktails.length} ricette</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-title">Margine Netto Medio</div>
      <div class="kpi-val">€ ${avgM.toFixed(2)}</div>
      <div class="kpi-sub">IVA ${db.settings.vatPercent}% scorporata</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-title">Fuori Target</div>
      <div class="kpi-val" style="color:${overCount === 0 ? 'var(--green)' : 'var(--red)'}">${overCount} drink</div>
      <div class="kpi-sub">${overCount === 0 ? 'Tutti nei parametri' : 'Oltre il target assegnato'}</div>
    </div>
  `;
  document.getElementById("navLbl0").textContent = `Bottiglie (${db.bottles.length})`;
  document.getElementById("navLbl1").textContent = `Cocktail (${db.cocktails.length})`;
}

function promptNewBottleCategory() {
  const name = prompt("Inserisci il nome della nuova categoria Bottiglie / Elementi:");
  if (!name || !name.trim()) return;
  const clean = name.trim();
  if (!db.settings.bottleCategories.includes(clean)) {
    db.settings.bottleCategories.push(clean);
  }
  selectedBottleCat = clean;
  saveAndRefresh();
}

function promptNewCocktailCategory() {
  const name = prompt("Inserisci il nome della nuova categoria Cocktail:");
  if (!name || !name.trim()) return;
  const clean = name.trim();
  const targetStr = prompt(`Imposta il Target Pour Cost % per "${clean}":`, String(db.settings.targetPourCostPercent || 20));
  const targetVal = Math.min(80, Math.max(5, parseNum(targetStr, 20)));
  if (!db.settings.cocktailCategories.includes(clean)) {
    db.settings.cocktailCategories.push(clean);
  }
  db.settings.categoryTargets[clean] = targetVal;
  selectedCocktailCat = clean;
  saveAndRefresh();
}

function renderBottles() {
  const cats = ["Tutte", ...getBottleCategories()];
  document.getElementById("bottleCatPills").innerHTML = cats.map(c =>
    `<button class="pill ${selectedBottleCat === c ? 'active' : ''}" onclick="selectedBottleCat=${JSON.stringify(c).replace(/"/g, '&quot;')};renderBottles()">${c}</button>`
  ).join("") + `<button class="pill-add" onclick="promptNewBottleCategory()">+ Categoria</button>`;

  const q = (document.getElementById("bottleSearch").value || "").toLowerCase().trim();
  const filtered = db.bottles.filter(b => {
    const mCat = selectedBottleCat === "Tutte" || b.category === selectedBottleCat;
    const mQ = !q || b.name.toLowerCase().includes(q) || b.category.toLowerCase().includes(q);
    return mCat && mQ;
  });

  const visCats = Array.from(new Set(filtered.map(b => b.category))).sort();
  let html = "";
  for (const cat of visCats) {
    html += `<div class="cat-header"><span>${cat}</span></div><div class="card-list">`;
    for (const b of filtered.filter(x => x.category === cat)) {
      const used = cocktailsUsing(b.id).length;
      const uc = unitCost(b);
      html += `
        <div class="item-card" onclick="openEditBottleModal('${b.id}')">
          <div class="item-main">
            <div class="item-name">${b.name}</div>
            <div class="item-meta">
              <span>${b.size} ${b.unit} • Spreco ${b.wastePercent}%</span>
              ${used > 0 ? `<span class="badge-drink" onclick="event.stopPropagation();filterByBottle('${b.id}')">🍸 ${used} drink</span>` : ''}
            </div>
          </div>
          <div class="item-right">
            <div class="price-big">€ ${b.price.toFixed(2)}</div>
            <div class="unit-sub">€ ${uc.toFixed(4)} / ${b.unit}</div>
          </div>
        </div>
      `;
    }
    html += `</div>`;
  }
  document.getElementById("bottlesContainer").innerHTML = html || `<div style="text-align:center;padding:30px;color:var(--subtext);">Nessun elemento in questa categoria.</div>`;
}

          </div>
          <button class="btn-reset-filter" onclick="activeBottleFilterId=null;renderCocktails()">Mostra Tutti</button>
        </div>
      `;
    }

    bannerEl.innerHTML = "";

  const cats = ["Tutte", ...getCocktailCategories()];
  document.getElementById("cocktailCatPills").innerHTML = cats.map(c =>
    `<button class="pill ${selectedCocktailCat === c ? 'active' : ''}" onclick="selectedCocktailCat=${JSON.stringify(c).replace(/"/g, '&quot;')};renderCocktails()">${c}</button>`
  ).join("") + `<button class="pill-add" onclick="promptNewCocktailCategory()">+ Categoria</button>`;

  const q = (document.getElementById("cocktailSearch").value || "").toLowerCase().trim();
  const filtered = db.cocktails.filter(c => {
    const mBot = !activeBottleFilterId || c.ingredients.some(i => i.bottleId === activeBottleFilterId);
    const mCat = selectedCocktailCat === "Tutte" || c.category === selectedCocktailCat;
    const mQ = !q || c.name.toLowerCase().includes(q) || c.category.toLowerCase().includes(q);
    return mBot && mCat && mQ;
  });

  const visCats = Array.from(new Set(filtered.map(c => c.category))).sort();
  let html = "";
  for (const cat of visCats) {
    const catTarget = (db.settings.categoryTargets && db.settings.categoryTargets[cat]) || db.settings.targetPourCostPercent;
    html += `
      <div class="cat-header">
        <span>${cat}</span>
        <span class="cat-target-tag">Target Categoria: ${catTarget}%</span>
      </div>
      <div class="card-list">
    `;
    for (const c of filtered.filter(x => x.category === cat)) {
      const dc = drinkCost(c);
      const pc = pourCostPercent(c);
      const m = netMargin(c);
      const target = getTargetPourCost(c);
      const col = pc <= target - 2 ? 'var(--green)' : (pc <= target + 1.5 ? 'var(--amber)' : 'var(--red)');
      const bgCol = pc <= target - 2 ? 'var(--green-soft)' : (pc <= target + 1.5 ? 'var(--amber-soft)' : 'var(--red-soft)');

      const parts = c.ingredients.map(i => {
        const b = getBottle(i.bottleId);
        if (!b) return "";
        const qVal = effectiveQty(i);
        const cVal = qVal * unitCost(b);
        return `${qVal}${b.unit} ${b.name} (€${cVal.toFixed(2)})`;
      }).filter(Boolean);
      if (c.includeGarnish) parts.push(`Garnish (€${db.settings.garnishCost.toFixed(2)})`);

      html += `
        <div class="item-card" style="flex-direction:column;align-items:stretch;" onclick="openEditCocktailModal('${c.id}')">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;">
            <div>
              <div class="item-name">${c.name}</div>
              <div class="item-meta">Menu: € ${c.menuPrice.toFixed(2)} • Margine: € ${m.toFixed(2)} • Target: ${target}%</div>
            </div>
            <div class="item-right">
              <div class="cost-big">€ ${dc.toFixed(2)}</div>
              <span class="pc-badge" style="background:${bgCol};color:${col}">PC: ${pc.toFixed(1)}%</span>
            </div>
          </div>
          <div class="pc-bar-bg">
            <div class="pc-bar-fill" style="width:${Math.min(100, Math.max(4, (pc/40)*100))}%;background:${col}"></div>
          </div>
          <div style="font-size:11px;color:var(--subtext);line-height:1.45;">${parts.join("  •  ")}</div>
        </div>
      `;
    }
    html += `</div>`;
  }
  document.getElementById("cocktailsContainer").innerHTML = html || `<div style="text-align:center;padding:30px;color:var(--subtext);">Nessun cocktail trovato.</div>`;
}

function updateCategoryTarget(cat, val) {
  const num = Math.min(80, Math.max(5, parseNum(val, 20)));

  saveAndRefresh();
}

/* --- MODALE MODIFICA / RIMOZIONE BOTTIGLIA --- */
function openEditBottleModal(id) {

  `;

  document.getElementById("modalBackdrop").classList.add("open");
}

function handleBottleCatChange(bottleId, selectEl) {
  if (selectEl.value === "__NEW__") {
    const n = prompt("Nome della nuova categoria Bottiglie:");
    if (n && n.trim()) {
      const clean = n.trim();
      if (!db.settings.bottleCategories.includes(clean)) db.settings.bottleCategories.push(clean);
      updateBottleField(bottleId, 'category', clean);
      openEditBottleModal(bottleId);
    } else {
      openEditBottleModal(bottleId);
    }
  } else {
    updateBottleField(bottleId, 'category', selectEl.value);
  }
}

function renderModalImpacted(bottleId) {
  const impacted = cocktailsUsing(bottleId);
  const el = document.getElementById("modalImpactedList");
  if (!el) return;
  if (impacted.length === 0) {
    el.innerHTML = `<div style="font-size:12px;color:var(--subtext);padding:6px 0;">Nessun cocktail utilizza questo elemento al momento.</div>`;
    return;
  }
  el.innerHTML = impacted.map(c => `
    <div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid rgba(255,255,255,0.05);">
      <div>
        <div style="font-weight:700;font-size:13px;">${c.name}</div>
        <div style="font-size:11px;color:var(--subtext);">Menu: € ${c.menuPrice.toFixed(2)}</div>
      </div>
      <div style="text-align:right;">
        <div style="font-weight:800;color:var(--green);">€ ${drinkCost(c).toFixed(2)}</div>
        <div style="font-size:11px;color:var(--subtext);">PC: ${pourCostPercent(c).toFixed(1)}%</div>
      </div>
    </div>
  `).join("") + `
    <button class="btn-add" style="width:100%;padding:11px;margin-top:12px;" onclick="closeModal();filterByBottle('${bottleId}')">
      Isola questi ${impacted.length} cocktail nel listino →
    </button>
  `;
}

function updateBottleField(id, field, val) {
  const b = getBottle(id);
  if (!b) return;
  if (field === "name" || field === "category" || field === "unit") {
    b[field] = String(val).trim() || b[field];
  } else {
    b[field] = Math.max(0, parseNum(val, b[field]));
  }
  lastModifiedBottleId = id;
  saveDB();
  renderKPIs();
  renderBottles();
  renderModalImpacted(id);
  showReactiveToast(id);
}

function deleteBottle(id) {
  const b = getBottle(id);
  if (!b) return;
  const used = cocktailsUsing(id);
  const msg = used.length > 0
    ? `Attenzione: "${b.name}" è usato in ${used.length} cocktail (${used.map(x=>x.name).join(", ")}). Vuoi davvero eliminarlo?`
    : `Vuoi eliminare definitivamente "${b.name}" dal magazzino?`;
  if (!confirm(msg)) return;

  db.bottles = db.bottles.filter(x => x.id !== id);
  db.cocktails.forEach(c => {
    c.ingredients = c.ingredients.filter(i => i.bottleId !== id);
  });
  if (activeBottleFilterId === id) activeBottleFilterId = null;
  if (lastModifiedBottleId === id) hideReactiveToast();
  closeModal();
  saveAndRefresh();
}

function hideReactiveToast() {
  lastModifiedBottleId = null;
  const t = document.getElementById("reactiveToast");
  if (t) t.style.display = "none";
}

function showReactiveToast(bottleId) {
  const b = getBottle(bottleId);
  const count = cocktailsUsing(bottleId).length;
  const t = document.getElementById("reactiveToast");
  if (!b || currentTab !== 0) { t.style.display = "none"; return; }
  t.style.display = "flex";
  t.innerHTML = `
    <button class="reactive-toast-close" title="Chiudi notifica" onclick="event.stopPropagation();hideReactiveToast()">✕</button>
    <div>
      <div style="font-weight:800;font-size:14px;color:var(--accent-light)">⚡ ${b.name}: € ${b.price.toFixed(2)}</div>
      <div style="font-size:12px;color:var(--subtext);">Ricalcolati in automatico ${count} cocktail</div>
    </div>
    <button class="reactive-toast-action" onclick="hideReactiveToast();filterByBottle('${bottleId}')">Vedi ${count} Drink →</button>
  `;
}

    <div id="editCocktailIngList"></div>

function handleCocktailCatChange(cocktailId, selectEl) {
  if (selectEl.value === "__NEW__") {
    const n = prompt("Nome della nuova categoria Cocktail:");
    if (n && n.trim()) {
      const clean = n.trim();
      const tStr = prompt(`Target Pour Cost % per "${clean}":`, "20");
      if (!db.settings.cocktailCategories.includes(clean)) db.settings.cocktailCategories.push(clean);
      db.settings.categoryTargets[clean] = Math.min(80, Math.max(5, parseNum(tStr, 20)));
      updateCocktailField(cocktailId, 'category', clean);
      renderEditCocktailModalContent(cocktailId);
    } else {
      renderEditCocktailModalContent(cocktailId);
    }
  } else {
    updateCocktailField(cocktailId, 'category', selectEl.value);
    renderEditCocktailModalContent(cocktailId);
  }
}

function renderExistingCocktailIngredients(cocktailId) {
  const c = db.cocktails.find(x => x.id === cocktailId);
  const container = document.getElementById("editCocktailIngList");
  if (!c || !container) return;

  container.innerHTML = c.ingredients.map((ing, idx) => {
    const curBottle = getBottle(ing.bottleId) || db.bottles[0];
    const unit = curBottle ? curBottle.unit : 'ml';
    const qVal = effectiveQty(ing);
    return `
      <div class="ing-row">
        <select onchange="updateExistingIngBottle('${c.id}', ${idx}, this.value)">
          ${db.bottles.map(b => `<option value="${b.id}" ${b.id === ing.bottleId ? 'selected' : ''}>${b.name} (€${b.price.toFixed(2)})</option>`).join("")}
        </select>
        <input type="text" inputmode="decimal" class="ing-qty" value="${qVal}" oninput="updateExistingIngQty('${c.id}', ${idx}, this.value)">
        <span class="ing-unit-lbl">${unit}</span>
        <button class="ing-remove-btn" title="Rimuovi ingrediente" onclick="removeExistingIng('${c.id}', ${idx})">✕</button>
      </div>
    `;
  }).join("");
}

function updateExistingIngBottle(cocktailId, idx, newBottleId) {
  const c = db.cocktails.find(x => x.id === cocktailId);
  if (!c || !c.ingredients[idx]) return;
  c.ingredients[idx].bottleId = newBottleId;
  c.ingredients[idx].useWineGlassDose = false;
  saveAndRefresh();
  renderEditCocktailModalContent(cocktailId);
}

function updateExistingIngQty(cocktailId, idx, val) {
  const c = db.cocktails.find(x => x.id === cocktailId);
  if (!c || !c.ingredients[idx]) return;
  c.ingredients[idx].qty = Math.max(0, parseNum(val, c.ingredients[idx].qty));
  c.ingredients[idx].useWineGlassDose = false;
  saveDB();
  renderKPIs();
  renderCocktails();
  refreshEditCocktailSummary(c);
}

function addIngredientToExistingCocktail(cocktailId) {
  const c = db.cocktails.find(x => x.id === cocktailId);
  if (!c || db.bottles.length === 0) return;
  c.ingredients.push({ bottleId: db.bottles[0].id, qty: 30 });
  saveAndRefresh();
  renderEditCocktailModalContent(cocktailId);
}

function removeExistingIng(cocktailId, idx) {
  const c = db.cocktails.find(x => x.id === cocktailId);
  if (!c) return;
  if (c.ingredients.length <= 1) {
    alert("Un cocktail deve avere almeno un ingrediente.");
    return;
  }
  c.ingredients.splice(idx, 1);
  saveAndRefresh();
  renderEditCocktailModalContent(cocktailId);
}

function updateCocktailField(id, field, val) {
  const c = db.cocktails.find(x => x.id === id);
  if (!c) return;
  if (field === "name" || field === "category") {
    c[field] = String(val).trim() || c[field];
  } else if (field === "menuPrice") {
    c.menuPrice = Math.max(0.5, parseNum(val, c.menuPrice));
  } else if (field === "includeGarnish") {
    c.includeGarnish = Boolean(val);
  } else if (field === "customTargetPC") {
    const trimmed = String(val).trim();
    if (!trimmed) {
      delete c.customTargetPC;
    } else {
      c.customTargetPC = Math.min(80, Math.max(5, parseNum(trimmed, 20)));
    }
  }
  saveDB();
  renderKPIs();
  renderCocktails();
  refreshEditCocktailSummary(c);
}

function refreshEditCocktailSummary(c) {
  const dcEl = document.getElementById("modDC");
  const pcEl = document.getElementById("modPC");
  const sugEl = document.getElementById("modSug");
  const tEl = document.getElementById("modTarget");
  if (dcEl) dcEl.textContent = "€ " + drinkCost(c).toFixed(2);
  if (pcEl) pcEl.textContent = pourCostPercent(c).toFixed(1) + "%";
  if (sugEl) sugEl.textContent = "€ " + suggestedMenuPrice(c).toFixed(2);
  if (tEl) tEl.textContent = getTargetPourCost(c);
}

function deleteCocktail(id) {
  const c = db.cocktails.find(x => x.id === id);
  if (!c) return;
  if (!confirm(`Vuoi eliminare definitivamente il cocktail "${c.name}"?`)) return;
  db.cocktails = db.cocktails.filter(x => x.id !== id);
  closeModal();
  saveAndRefresh();
}

/* --- MODALE NUOVA BOTTIGLIA (CON SCELTA / CREAZIONE CATEGORIA) --- */

  const cats = getBottleCategories();
  document.getElementById("modalContent").innerHTML = `
    <div class="modal-header">
      <div class="modal-title">Nuova Bottiglia / Elemento</div>
      <button class="btn-close" onclick="saveNewBottle()">Aggiungi</button>
    </div>
    <div class="form-row">
      <label>Nome</label>
      <input id="nbName" class="form-input form-input-wide" placeholder="Es. Montenegro">
    </div>
    <div class="form-row">
      <label>Categoria</label>
      <select id="nbCat" class="form-select form-select-wide" onchange="if(this.value==='__NEW__'){document.getElementById('nbNewCatRow').style.display='flex';}else{document.getElementById('nbNewCatRow').style.display='none';}">
        ${cats.map(c => `<option value="${c}">${c}</option>`).join("")}
        <option value="__NEW__">+ Crea Nuova Categoria...</option>
      </select>
    </div>
    <div class="form-row" id="nbNewCatRow" style="display:none;">
      <label>Nome Nuova Categoria</label>
      <input id="nbNewCat" class="form-input form-input-wide" placeholder="Es. Amari Artigianali">
    </div>
    <div class="form-row">
      <label>Unità di Misura</label>
      <select id="nbUnit" class="form-select">
        <option value="ml">ml (Millilitri)</option>
        <option value="pz">pz (Pezzo singolo)</option>
      </select>
    </div>
    <div class="form-row">
      <label>Formato</label>
      <input id="nbSize" type="text" inputmode="decimal" class="form-input" value="1000">
    </div>
    <div class="form-row">
      <label>Prezzo (€ IVA escl.)</label>
      <input id="nbPrice" type="text" inputmode="decimal" class="form-input" value="15,00">
    </div>
    <div class="form-row">
      <label>Spreco (%)</label>
      <input id="nbWaste" type="text" inputmode="decimal" class="form-input" value="5">
    </div>
  `;
  document.getElementById("modalBackdrop").classList.add("open");
}

function saveNewBottle() {
  const name = (document.getElementById("nbName").value || "").trim();
  if (!name) { alert("Inserisci il nome della bottiglia."); return; }
  let category = document.getElementById("nbCat").value;
  if (category === "__NEW__") {
    category = (document.getElementById("nbNewCat").value || "").trim() || "Liquori";
    if (!db.settings.bottleCategories.includes(category)) {
      db.settings.bottleCategories.push(category);
    }
  }
  const unit = document.getElementById("nbUnit").value;
  const size = parseNum(document.getElementById("nbSize").value, unit === "pz" ? 1 : 1000);
  const price = parseNum(document.getElementById("nbPrice").value, 15);
  const waste = parseNum(document.getElementById("nbWaste").value, unit === "pz" ? 0 : 5);
  db.bottles.push({
    id: name.toLowerCase().replace(/[^a-z0-9]/g, "_") + "_" + Math.floor(Math.random()*900+100),
    name, category, unit, size, price, wastePercent: waste
  });
  saveAndRefresh();
  closeModal();
}

/* --- MODALE NUOVO COCKTAIL (CON MULTI-INGREDIENTI ILLIMITATI) --- */
function openAddCocktailModal() {
  const cats = getCocktailCategories();
  const b0 = db.bottles[0] ? db.bottles[0].id : "gin_base";
  const b1 = db.bottles[1] ? db.bottles[1].id : b0;
  draftIngredients = [
    { bottleId: b0, qty: 50 },
    { bottleId: b1, qty: 150 }
  ];

  document.getElementById("modalContent").innerHTML = `
    <div class="modal-header">
      <div class="modal-title">Nuovo Cocktail</div>
      <button class="btn-close" onclick="saveNewCocktail()">Crea Drink</button>
    </div>
    <div class="form-row">
      <label>Nome Drink</label>
      <input id="ncName" class="form-input form-input-wide" placeholder="Es. Paloma">
    </div>
    <div class="form-row">
      <label>Categoria</label>
      <select id="ncCat" class="form-select form-select-wide" onchange="if(this.value==='__NEW__'){document.getElementById('ncNewCatRow').style.display='flex';}else{document.getElementById('ncNewCatRow').style.display='none';}">
        ${cats.map(c => `<option value="${c}">${c}</option>`).join("")}
        <option value="__NEW__">+ Crea Nuova Categoria...</option>
      </select>
    </div>
    <div class="form-row" id="ncNewCatRow" style="display:none;">
      <label>Nome Nuova Categoria</label>
      <input id="ncNewCat" class="form-input form-input-wide" placeholder="Es. Tiki & Tropical">
    </div>
    <div class="form-row">
      <label>Prezzo Menu (€ IVA incl.)</label>
      <input id="ncPrice" type="text" inputmode="decimal" class="form-input" value="8,00">
    </div>
    <div class="form-row">
      <label>Target Pour Cost % (opz.)</label>
      <input id="ncCustomTarget" type="text" inputmode="decimal" class="form-input" placeholder="Auto da categoria">
    </div>

    <div class="cat-header" style="margin-top:14px;">
      <span>Ingredienti Ricetta</span>
      <button class="btn-secondary" onclick="addDraftIngredientRow()">+ Aggiungi Ingrediente</button>
    </div>
    <div id="ncIngContainer"></div>
  `;
  renderDraftIngredients();
  document.getElementById("modalBackdrop").classList.add("open");
}

function renderDraftIngredients() {
  const container = document.getElementById("ncIngContainer");
  if (!container) return;
  container.innerHTML = draftIngredients.map((ing, idx) => {
    const b = getBottle(ing.bottleId) || db.bottles[0];
    const unit = b ? b.unit : 'ml';
    return `
      <div class="ing-row">
        <select onchange="draftIngredients[${idx}].bottleId=this.value;renderDraftIngredients()">
          ${db.bottles.map(bt => `<option value="${bt.id}" ${bt.id === ing.bottleId ? 'selected' : ''}>${bt.name} (${bt.unit})</option>`).join("")}
        </select>
        <input type="text" inputmode="decimal" class="ing-qty" value="${ing.qty}" oninput="draftIngredients[${idx}].qty=parseNum(this.value, 30)">
        <span class="ing-unit-lbl">${unit}</span>
        <button class="ing-remove-btn" onclick="removeDraftIngredientRow(${idx})">✕</button>
      </div>
    `;
  }).join("");
}

function addDraftIngredientRow() {
  const defaultId = db.bottles[0] ? db.bottles[0].id : "";
  draftIngredients.push({ bottleId: defaultId, qty: 30 });
  renderDraftIngredients();
}

function removeDraftIngredientRow(idx) {
  if (draftIngredients.length <= 1) {
    alert("Inserisci almeno un ingrediente.");
    return;
  }
  draftIngredients.splice(idx, 1);
  renderDraftIngredients();
}

function saveNewCocktail() {
  const name = (document.getElementById("ncName").value || "").trim();
  if (!name) { alert("Inserisci il nome del cocktail."); return; }
  let category = document.getElementById("ncCat").value;
  if (category === "__NEW__") {
    category = (document.getElementById("ncNewCat").value || "").trim() || "Signature & IBA";
    if (!db.settings.cocktailCategories.includes(category)) {
      db.settings.cocktailCategories.push(category);
      db.settings.categoryTargets[category] = db.settings.targetPourCostPercent || 20.0;
    }
  }
  const menuPrice = parseNum(document.getElementById("ncPrice").value, 8);
  const customTargetRaw = (document.getElementById("ncCustomTarget").value || "").trim();
  const newDrink = {
    id: name.toLowerCase().replace(/[^a-z0-9]/g, "_") + "_" + Math.floor(Math.random()*900+100),
    name,
    category,
    menuPrice,
    includeGarnish: true,
    ingredients: draftIngredients.filter(i => i.bottleId && i.qty > 0)
  };
  if (customTargetRaw) {
    newDrink.customTargetPC = Math.min(80, Math.max(5, parseNum(customTargetRaw, 20)));
  }
  db.cocktails.push(newDrink);
  saveAndRefresh();
  closeModal();
}

function closeModal() {
  document.getElementById("modalBackdrop").classList.remove("open");
}

function switchTab(idx) {
  currentTab = idx;
  document.getElementById("tabBottles").style.display = idx === 0 ? "block" : "none";
  document.getElementById("tabCocktails").style.display = idx === 1 ? "block" : "none";
  document.getElementById("tabSettings").style.display = idx === 2 ? "block" : "none";
  document.getElementById("navBtn0").classList.toggle("active", idx === 0);
  document.getElementById("navBtn1").classList.toggle("active", idx === 1);
  document.getElementById("navBtn2").classList.toggle("active", idx === 2);
  if (idx !== 0) document.getElementById("reactiveToast").style.display = "none";
  renderAll();
}

function exportJSON() {
  const blob = new Blob([JSON.stringify(db, null, 2)], {type: "application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "DrinkCost_Backup.json"; a.click();
}

function importJSON(ev) {
  const file = ev.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const parsed = JSON.parse(e.target.result);
      if (parsed && parsed.bottles && parsed.cocktails) {
        db = parsed;
        ensureDBIntegrity();
        saveAndRefresh();
        alert("Database importato e salvato con successo!");
      }
    } catch (err) { alert("File JSON non valido."); }
  };
  reader.readAsText(file);
}

function resetKeepPrices() {
  const factory = getFactoryDB();
  const priceMap = {};
  db.bottles.forEach(b => priceMap[b.id] = b.price);
  factory.bottles.forEach(b => { if (priceMap[b.id] !== undefined) b.price = priceMap[b.id]; });
  db = factory;
  ensureDBIntegrity();
  saveAndRefresh();
}

function saveAndRefresh() {
  saveDB();
  renderAll();
}

function renderAll() {
  renderKPIs();
  renderBottles();
  renderCocktails();
  renderSettings();
}

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}

loadDB();
renderAll();
</script>
